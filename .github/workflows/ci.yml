name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      HUSKY: "0" # don't install git hooks in CI
      # Dummy values: only needed so Prisma generate and the web env validation can run.
      DATABASE_URL: postgresql://lifeos:lifeos@localhost:5431/lifeos
      NEXT_PUBLIC_API_URL: http://localhost:4000/api/v1
      JWT_ACCESS_SECRET: ci-access-secret-at-least-32-characters
      JWT_REFRESH_SECRET: ci-refresh-secret-at-least-32-characters
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Order matters: api and web import the built shared package and the generated Prisma client.
      - run: pnpm --filter @lifeos/shared build
      - run: pnpm --filter api db:generate
      - name: Normalize Prisma client output path
        run: |
          if [ -d apps/api/prisma/src/generated/prisma ] && [ ! -e apps/api/src/generated/prisma ]; then
            mkdir -p apps/api/src/generated
            mv apps/api/prisma/src/generated/prisma apps/api/src/generated/prisma
          fi

      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm test
      - run: pnpm build
